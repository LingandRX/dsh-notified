# dsh-notified — Windows conversation-completion notifications.
#
# Inserts one host-side plugin row. Its config is the settings form: edit the
# values here, or use the plugin row in the sidebar's Plugins page, which is
# generated from the same schema.
#
# The hook is `session/event` -> `turn/end`, so a toast is posted only after a
# turn settles with an assistant reply. A user who is already looking at the app
# is not interrupted (`suppressWhenFocused`), and turns that settle close
# together are merged into one toast (`coalesceMs`).
- insert:
    - id: dsh-notified
      name: dsh-notified
      config:
        enabled: true
        notifyOn:
          - completed
        suppressWhenFocused: true
        foregroundProcessNames:
          - DeepSeek Harness
        coalesceMs: 1500
        minTurnDurationMs: 0
        includeSubagents: false
        bodyMaxChars: 140
        showDuration: true
        appId: DeepSeek.Harness.Notified
        registerAumid: true
        iconPath: ""
        launch: dsh://open
        duration: short
        sound: false
        mergedTemplate: "{count} conversations finished"
        emptyBody: Turn finished
        verbose: false
